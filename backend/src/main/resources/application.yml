spring:
  application:
    name: agenda-rdv
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda}
    username: ${DB_USER:agenda}
    password: ${DB_PASSWORD:agenda}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 8h
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}
